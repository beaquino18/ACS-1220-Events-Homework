{% extends 'base.html' %}

{% block content %}

<h1>Events</h1>

<a href="/create">+ New Event</a>

<section class="event-container">
    {% for event in all_events %}
        <h1><a href="/event/{{ event.id }}">{{event.title}}</a></h1>
        <p><strong>Date and Time: </strong>{{event.date_and_time}}</p>
        <p><strong>Description: </strong>{{event.description}}</p>
        <p class="small-text">{{event.guests|length}} guests attending</p>
    {% endfor %}
</section>



{% endblock %}
